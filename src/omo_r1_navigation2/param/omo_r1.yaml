bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1 # 기존의 값: 0.5, robot know that i have to move at least 10cm 
      movement_time_allowance: 50.0 # 가존의 값: 10.0
    
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      
      #목적지 도착 판정 범위
      xy_goal_tolerance: 0.25 # 목표 도착 시 x-y 평면에서 허용하는 오차 범위(미터) 0.25
      yaw_goal_tolerance: 7.0 # 회전(heading) 오차 0.25

    # DWB parameters
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"  
      angular_dist_threshold: 0.785
      forward_sampling_distance: 2.0 # 2m 전방 기준 조향
      angular_disengage_threshold: 0.3925
      rotate_to_heading_angular_vel: 0.5 # 0.3 -> 0.5
      max_angular_accel: 0.6 # 0.3 -> 0.6
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: True
    
      debug_trajectory_details: True
      min_vel_x: 0.0 # 로봇의 x축(전진/후진) 최소/최대 속도를 지정
      min_vel_y: 0.0
      max_vel_x: 0.30 # 장애물 인지 및 회피 궤적 생성을 위한 최적 전진 속도 (기존 0.4)
      max_vel_y: 0.0
      max_vel_theta: 0.8 # 민첩한 조향을 위한 회전 속도 대폭 상향 (기존 0.3)
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.20
      acc_lim_y: 0.0
      acc_lim_theta: 0.8 # 회전 가속도 상향 (기존 0.4)
      decel_lim_x: -0.20
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 25 # 회전 샘플링 수 확대
      sim_time: 2.5 # 전방 궤적 예측 시간 대폭 확대 (2.5초 = 3m 전방 미리 회피)
      linear_granularity: 0.05 # 5cm 단위 궤적 정밀 충돌 검사
      angular_granularity: 0.05
      transform_tolerance: 0.1 #0.2
      xy_goal_tolerance: 0.20 # 기존: 0.05
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["ObstacleFootprint", "RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint:
        plugin: "dwb_critics::ObstacleFootprintCritic"
        scale: 1.0
      BaseObstacle.scale: 8.0 # 장애물 회피 반발력 대폭 강화 (기존 1.5 -> 8.0)
      PathAlign.scale: 3.0 # 경로 각도 고집 완화 (기존 10.0 -> 3.0)
      PathAlign.forward_point_distance: 0.8
      GoalAlign.scale: 5.0 # 목표 방향 고집 완화 (기존 12.0 -> 5.0)
      GoalAlign.forward_point_distance: 0.6
      PathDist.scale: 4.0 # 원래 직선 경로 이탈 허용 (기존 16.0 -> 4.0)
      GoalDist.scale: 8.0 # 최단거리 직진 고집 완화 (기존 20.0 -> 8.0)
      RotateToGoal: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.1
      robot_radius: 0.40 # 실제 로봇(0.33m) + 안전마진 7cm
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.90 # 안전 완충 거리 90cm로 확대하여 3m 전방부터 회피 유도
        cost_scaling_factor: 2.5

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true  # 장애물 레이어 사용 여부
        footprint_clearing_enabled: true  # 로봇 발 밑 장애물 제거
        combination_method: 1  # 0: 덮어쓰기, 1: 최대값 사용, 2: unknown만 덮기

        observation_sources: scan  # 사용 센서 이름 (공백 없이 나열)
        
        scan:
          topic: /scan  # 센서 데이터 토픽 이름
          sensor_frame: lidar_link  # 비워두면 메시지에서 frame_id 사용
          observation_persistence: 0.0  # 센서 데이터 유지 시간 (s)
          expected_update_rate: 10.0  # 예상 갱신 주기 (s)
          data_type: "LaserScan"  # LaserScan 또는 PointCloud2

          min_obstacle_height: 0.0  # 최소 장애물 높이
          max_obstacle_height: 10.0 # 최대 장애물 높이

          ###### Raytracing & Real-time Clearing
          inf_is_valid: False  # inf 광선으로 인한 사각지대 장애물 삭제 방지
          marking: True       # 장애물 마킹
          clearing: True      # 장애물이 치워졌을 때 실시간으로 코스트맵 클리어

          obstacle_max_range: 5.0  # 장애물 마킹 최대 거리 (5m로 확대하여 3~4m 전방부터 인지)
          obstacle_min_range: 0.0  # 장애물 마킹 최소 거리

          raytrace_max_range: 6.0  # 레이 트레이싱 최대 거리
          raytrace_min_range: 0.0  # 레이 트레이싱 최소 거리
    
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.40 # 0.5
      resolution: 0.1
      rolling_window: true
      width: 25
      height: 25
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]   

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true  # 장애물 레이어 사용 여부
        footprint_clearing_enabled: false  # 로봇 발 밑 장애물 제거
        combination_method: 1  # 0: 덮어쓰기, 1: 최대값 사용, 2: unknown만 덮기

        observation_sources: scan  # 사용 센서 이름 (공백 없이 나열)
        
        scan:
          topic: /scan  # 센서 데이터 토픽 이름
          sensor_frame: lidar_link  # 비워두면 메시지에서 frame_id 사용
          observation_persistence: 0.0  # 센서 데이터 유지 시간 (s)
          expected_update_rate: 10.0  # 예상 갱신 주기 (s)
          data_type: "LaserScan"  # LaserScan 또는 PointCloud2

          min_obstacle_height: 0.0  # 최소 장애물 높이
          max_obstacle_height: 10.0 # 최대 장애물 높이

          ###### Raytracing & Real-time Clearing
          inf_is_valid: False  # inf 광선으로 인한 사각지대 장애물 삭제 방지
          marking: True       # 장애물 마킹
          clearing: True      # 장애물이 치워졌을 때 실시간으로 코스트맵 클리어

          obstacle_max_range: 5.0  # 장애물 마킹 최대 거리 (5m로 확대)
          obstacle_min_range: 0.0  # 장애물 마킹 최소 거리

          raytrace_max_range: 6.0  # 레이 트레이싱 최대 거리
          raytrace_min_range: 0.0  # 레이 트레이싱 최소 거리

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.90 # 3m 전방부터 글로벌 경로 우회 유도
      always_send_full_costmap: False
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true


planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["wait"] # "spin", "backup",
    
    #spin:
    #  plugin: "nav2_recoveries/Spin"
    #backup:
    #  plugin: "nav2_recoveries/BackUp"
    
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.0 #3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 2000
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200